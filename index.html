<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell</title>
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
</head>
<body>
<header class="nav" id="nav"></header>
<main>
    <section>
        <h1>Read what writers publish. Subscribe to the ones you like.</h1>
        <p class="muted">Latest articles</p>
        <div id="articles"></div>
    </section>
    <aside id="writers"></aside>
</main>
<script>
(async () => {
    const user = await loadNav();
    loadWriters(document.getElementById('writers'), user);
    const { articles } = await api('api/articles.php');
    document.getElementById('articles').innerHTML =
        articles.length ? articles.map(articleCard).join('') : '<p>No articles yet.</p>';
})();
</script>
</body>
</html>
